
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Advanced Search</title>

        <style>
            .advanced.content {
                display: grid;
                grid-template-columns: 180px 1fr;
                gap: 12px;
                align-items: center;
            }

            .buttons{
                  display: flex;
                  justify-content: center;
            
            .advanced.content {
                   row-gap: 18px;
            }
            }

            .buttons input{
                    display: flex;
                    justify-content: center;
                    position: relative;
                    align-items: center;
                    z-index: 0;
                    box-sizing: border-box;
                    padding: 7px 15px;
                    border: 1px solid transparent;
                    border-radius: 9999px;
                    background-color: #4d90fe;
                    color: white;
                    width: auto;
                    cursor: pointer;
                }
            

            .txtboxes input {
                padding: 2px 16px;
                background: white;
                color: #202124;
                width: 100%;
                border: 1px solid #777;
                position: relative;
                border-radius: 8px;
                padding: 8px 16px;
                max-width: 480px;
                box-sizing: border-box;
                                
            }

            h1 {
                display: block;
                font-size: 2em;
                margin-block-start: 0.67em;
                margin-block-end: 0.67em;
                margin-inline-start: 0;
                margin-inline-end: 0;
                font-weight: bold;
                unicode-bidi: isolate;
            }

            .top-links {
                display: flex;
                justify-content: flex-end;
}
        </style>

    </head>
    <body>
        
        <div class="top-links">
            <a href="index.html">Google Search</a>
        </div>
        <h1>Advanced Search</h1>

        <h2>Find pages with</h2>

        <form action="https://www.google.com/search">

        <div class="advanced content">

         <div class="labels">
            <label for="All_these_words">All these words </label>
        </div>
        <div class="txtboxes">
            <input type="text" id="All_these_words" name="as_q" autocomplete="off">
        </div>
         <div class="labels">
            <label for="exact_phrase">The exact word or phrase</label>
        </div>
         <div class="txtboxes">
            <input type="text" id="exact_phrase" name="as_epq" autocomplete="off">
        </div>

        
         <div class="labels">
            <label for="Any_of_these_words">Any of these words</label>
        </div>
        <div class="txtboxes">
            <input type="text" id="Any_of_these_words" name="as_oq" autocomplete="off">
        </div>
         <div class="labels">
            <label for="None_of_these_words">None of these words</label>
        </div>
         <div class="txtboxes">
            <input type="text" id="None_of_these_words" name="as_eq" autocomplete="off">
        </div>
        
        <div class="buttons">
            <input type="submit" value="Advanced Search">
        </div>
            
        </div>

            
            
        </form>

    </body>
</html>
