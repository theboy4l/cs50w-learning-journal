<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            .actions {
                text-align: right;
                padding: 20px;
            }
            .advanced.content {
    row-gap: 18px;
}

            .actions a {
                margin-left: 15px;
                text-decoration: none;
                color: #202124;
                font-size: 16px;
            }

            .actions a:hover {
                text-decoration: underline;
            }
            
            .logo {
                text-align: center;
                margin-top: 100px;
            }

            .logo img {
                width: 272px;
                height: auto;
            }

            
            .buttons {
                text-align: center;
                margin-top: 20px;
            }

            .buttons input {
                padding: 10px 18px;
                border: 1px solid #f8f9fa;
                border-radius: 4px;
                background-color: #f8f9fa;
                font-size: 14px;
                cursor: pointer;
            }

            .textboxes {
                text-align: center;
                margin-top: 20px;
            }

            .textboxes input {
                width: 400px;
                max-width: 80%;
                padding: 12px 16px;
                border: 1px solid #dfe1e5;
                border-radius: 24px;
                outline: none;
                box-sizing: border-box;
            }
        </style>
    </head>

    <body>
        <div class="actions">
            <a href="image.html">Image Search</a>
            <a href="advanced.html">Advanced Search</a>
        </div>

        <form action="https://www.google.com/search">

            <div class="logo">
                <img src="google_image.png" alt="Google">
            </div>

            <div class="textboxes">
                <input type="text" id="search" name="q">
            </div>

            <div class="buttons">
                <input type="submit" id="submit_results"
                       name="submit_results" value="Google Search">
                <input type="submit" id="feeling_lucky" value="I'm Feeling Lucky">
            </div>

            

        </form>
    </body>
</html>
