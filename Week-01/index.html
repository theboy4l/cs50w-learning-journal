
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <div class="d-flex justify-content-end p-4 gap-3">
        <a href="image.html" class="text-decoration-none text-dark">
            Image Search
        </a>
        <a href="advanced.html" class="text-decoration-none text-dark">
            Advanced Search
        </a>
    </div>

    <form action="https://www.google.com/search">

        <div class="text-center mt-5 pt-5">
            <img src="google_image.png" alt="Google"
                 class="img-fluid"
                 style="width: 272px;">
        </div>

        <div class="d-flex justify-content-center mt-4">
            <input type="text" id="search" name="q"
                   class="form-control rounded-pill px-3"
                   style="width: 400px; max-width: 80%;">
        </div>

        <div class="d-flex justify-content-center gap-2 mt-4">
            <input type="submit" id="submit_results"
                   name="submit_results" value="Google Search"
                   class="btn btn-light border-0">

            <input type="submit" id="feeling_lucky"
                   value="I'm Feeling Lucky"
                   class="btn btn-light border-0">
        </div>

    </form>

</body>
</html>
